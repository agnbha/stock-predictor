# The "Stock Predictor" folder in stock-analyzer's Grafana, beside its "Stock Analyzer" one.
# grafana/add-to-stock-analyzer.sh fills in the path: this repo's grafana/dashboards.
apiVersion: 1

providers:
  - name: stock-predictor
    folder: Stock Predictor
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: __DASHBOARDS__
      foldersFromFilesStructure: false
